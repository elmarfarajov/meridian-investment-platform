name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (SQLite, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q --cov=meridian --cov-report=term-missing

  postgres:
    name: Integration tests (PostgreSQL 16)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MERIDIAN_DATABASE_URL: postgresql+psycopg://meridian:meridian@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Alembic migrations
        run: alembic upgrade head
      - name: Schema drift check
        # Fails if the models and the migrations have drifted apart
        run: alembic check
      - name: Integration tests
        run: pytest -q -m integration

  docker:
    name: Docker image and stack
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d db migrate api
      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/ready
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token -d "username=analyst&password=analyst-demo-2026" | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8000/v1/portfolios
          curl -fsS http://localhost:8000/openapi.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/portfolios)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
